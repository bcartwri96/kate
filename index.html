<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Private, on-device conversation transcription.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Kate</title>
</head>
<body>
  <main id="appShell" class="loading-screen" aria-live="polite">
    <button id="clearLink" class="clear-link" type="button">Clear convo</button>
    <div class="loading-content">
      <h1 id="loadingText">Downloading model...</h1>
      <div id="progressTrack" class="progress-track" role="progressbar" aria-label="Model download progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <section id="liveTranscript" class="live-transcript" aria-label="Live transcript" hidden>
        <p id="transcriptText"></p>
      </section>
      <button id="retryButton" hidden>Try again</button>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
